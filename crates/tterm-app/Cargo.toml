[package]
name = "tterm-app"
description = "Tanis Terminal, the window: tabs, settings and the terminal view on gpui and telaio."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "tterm"
path = "src/main.rs"

[dependencies]
gpui-kit = { workspace = true }
async-channel = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
log = { workspace = true }
rust-i18n = { workspace = true }
telaio-ui = { workspace = true }
telaio-app = { workspace = true }
tterm-cli = { path = "../tterm-cli" }
tterm-term = { path = "../tterm-term" }

[dev-dependencies]
tempfile = { workspace = true }
pretty_assertions = { workspace = true }

[lints]
workspace = true

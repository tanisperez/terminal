[package]
name = "tterm-app"
description = "Tanis Terminal, the window: tabs, settings and the terminal view on gpui and telaio."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "tterm"
path = "src/main.rs"

[dependencies]
gpui-kit = { workspace = true }
async-channel = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
log = { workspace = true }
rust-i18n = { workspace = true }
telaio-ui = { workspace = true }
telaio-app = { workspace = true }
tterm-cli = { path = "../tterm-cli" }
tterm-term = { path = "../tterm-term" }
tterm-usage = { path = "../tterm-usage" }
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
pretty_assertions = { workspace = true }

[lints]
workspace = true

# The icons are embedded by rust-embed, which in a debug build reads them from the build
# machine's disk instead. A debug build cross-compiled for Windows (cargo-xwin) runs on another
# machine, so it embeds them too. Same version as gpui-kit-assets.
[target.'cfg(windows)'.dependencies]
rust-embed = { version = "8.14.0", features = ["debug-embed"] }

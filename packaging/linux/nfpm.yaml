# nfpm config for the deb and rpm packages. Driven by package.sh, which sets:
# Content entries use "expand: true" so nfpm expands the variables in src.
#   TTERM_VERSION  e.g. 0.1.0 or 0.1.0-rc.1 (nfpm maps the pre-release to 0.1.0~rc.1)
#   TTERM_ARCH     amd64 or arm64 (Go style, nfpm converts it for rpm)
#   TTERM_BIN      path to the tterm binary
#   TTERM_ROOT     repo root
name: tterm
arch: ${TTERM_ARCH}
platform: linux
version: ${TTERM_VERSION}
version_schema: semver
section: x11
priority: optional
maintainer: Estanislao Pérez Nartallo <tanisperez@gmail.com>
description: |
  A fast, native terminal emulator.
  Tanis Terminal is a native terminal emulator written in Rust on top of libghostty-vt, with
  tabs, profiles, shell integration and pasted screenshots, and stays idle when nothing changes.
vendor: Tanis Terminal
homepage: https://github.com/tanisperez/terminal
license: Apache-2.0

contents:
  # /usr/bin is on the PATH: `tterm folder` opens a window there from any terminal.
  - src: ${TTERM_BIN}
    dst: /usr/bin/tterm
    expand: true
    file_info:
      mode: 0755
  - src: ${TTERM_ROOT}/packaging/linux/codes.tanis.tterm.desktop
    dst: /usr/share/applications/codes.tanis.tterm.desktop
    expand: true
    file_info:
      mode: 0644
  - src: ${TTERM_ROOT}/packaging/icons/tterm.svg
    dst: /usr/share/icons/hicolor/scalable/apps/codes.tanis.tterm.svg
    expand: true
    file_info:
      mode: 0644
  - src: ${TTERM_ROOT}/packaging/icons/png/tterm-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/codes.tanis.tterm.png
    expand: true
    file_info:
      mode: 0644
  - src: ${TTERM_ROOT}/packaging/icons/png/tterm-24.png
    dst: /usr/share/icons/hicolor/24x24/apps/codes.tanis.tterm.png
    expand: true
    file_info:
      mode: 0644
  - src: ${TTERM_ROOT}/packaging/icons/png/tterm-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/codes.tanis.tterm.png
    expand: true
    file_info:
      mode: 0644
  - src: ${TTERM_ROOT}/packaging/icons/png/tterm-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/codes.tanis.tterm.png
    expand: true
    file_info:
      mode: 0644
  - src: ${TTERM_ROOT}/packaging/icons/png/tterm-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/codes.tanis.tterm.png
    expand: true
    file_info:
      mode: 0644
  - src: ${TTERM_ROOT}/packaging/icons/png/tterm-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/codes.tanis.tterm.png
    expand: true
    file_info:
      mode: 0644
  - src: ${TTERM_ROOT}/packaging/icons/png/tterm-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/codes.tanis.tterm.png
    expand: true
    file_info:
      mode: 0644
  - src: ${TTERM_ROOT}/packaging/icons/png/tterm-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/codes.tanis.tterm.png
    expand: true
    file_info:
      mode: 0644
  # deb convention: the license under /usr/share/doc/<name>/.
  - src: ${TTERM_ROOT}/LICENSE
    dst: /usr/share/doc/tterm/LICENSE
    expand: true
    file_info:
      mode: 0644
    packager: deb
  - src: ${TTERM_ROOT}/NOTICE
    dst: /usr/share/doc/tterm/NOTICE
    expand: true
    file_info:
      mode: 0644
    packager: deb
  # rpm convention: /usr/share/licenses/<name>/, flagged as a license file.
  - src: ${TTERM_ROOT}/LICENSE
    dst: /usr/share/licenses/tterm/LICENSE
    expand: true
    type: license
    file_info:
      mode: 0644
    packager: rpm
  - src: ${TTERM_ROOT}/NOTICE
    dst: /usr/share/licenses/tterm/NOTICE
    expand: true
    type: license
    file_info:
      mode: 0644
    packager: rpm

# Runtime libraries the binary links (libxcb, libxkbcommon, libxkbcommon-x11) or loads with
# dlopen (wayland-client, wayland-egl, EGL), as Postino's. Vulkan is only a recommendation: wgpu
# can use it, but the binary does not name it. Names differ between deb and rpm.
depends:
  - libxkbcommon0
  - libxkbcommon-x11-0
  - libxcb1
  - libwayland-client0
  - libwayland-egl1
  - libegl1
recommends:
  - libvulkan1
overrides:
  rpm:
    depends:
      - libxkbcommon
      - libxkbcommon-x11
      - libxcb
      - libwayland-client
      - libwayland-egl
      - libglvnd-egl
    recommends:
      - vulkan-loader

# Publishes site/ to GitHub Pages (terminal.tanis.codes). The site is rebuilt from scratch on
# every run, there is no gh-pages branch (docs/releasing.md).
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/website.yml"
  # A stable release changes the download links.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Generates site/docs/ from site/docs-src/. Fails on a broken link or anchor between pages.
      - name: Build the documentation
        run: python3 site/docs-src/build.py

      # site/docs-src holds the sources of site/docs and site/screenshots the capture script, not
      # pages.
      - name: Assemble the site
        run: rsync -a --exclude docs-src/ --exclude screenshots/ --exclude README.md site/ _site/

      # The download buttons point at the files of the latest stable release, and the pages show
      # its version. Without a stable release they keep linking to the releases page.
      - name: Link the downloads to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "No stable release yet, the downloads link to the releases page."
            exit 0
          fi
          python3 site/docs-src/release_links.py _site "$tag"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # deploy-pages looks the artifact up right away and GitHub may not list it yet: deploys
      # failed with "No artifacts named github-pages" a tenth of a second after the upload.
      - name: Wait for the artifact to be listed
        run: sleep 15

      - id: deployment
        uses: actions/deploy-pages@v5
